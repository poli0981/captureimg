name: CI

# Every job name below is a required status check on `main` (repository ruleset).
# Keep job ids stable and never add `paths:` filters here: a required check that
# does not report leaves the pull request waiting forever.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore CaptureImage.sln --locked-mode

      - name: Build (Release, warnings as errors)
        run: dotnet build CaptureImage.sln -c Release --no-restore

      - name: Test (Microsoft.Testing.Platform + coverage)
        run: >
          dotnet test --solution CaptureImage.sln -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura
          --report-xunit-trx

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:TestResults/*.cobertura.xml" "-targetdir:coverage-report" `
            "-reporttypes:MarkdownSummaryGithub;Cobertura" "-assemblyfilters:+CaptureImage.*;-CaptureImage.*.Tests"
          if (Test-Path coverage-report/SummaryGithub.md) {
            Get-Content coverage-report/SummaryGithub.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload test results + coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage-report/**
          retention-days: 14

  format:
    name: format
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore CaptureImage.sln --locked-mode

      - name: Whitespace / line endings
        run: dotnet format whitespace CaptureImage.sln --no-restore --verify-no-changes

      # Unused-member rules (IDE0051/0052/…) are enforced by the compiler in `build`,
      # where XAML-generated code is visible; `dotnet format` cannot see it.
      - name: Code style (SPDX header, namespaces, usings)
        run: >
          dotnet format style CaptureImage.sln --no-restore --verify-no-changes
          --diagnostics IDE0073 IDE0161 IDE0065 IDE0005

  deadcode:
    name: deadcode
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore + build
        run: |
          dotnet restore CaptureImage.sln --locked-mode
          dotnet build CaptureImage.sln -c Release --no-restore
          dotnet tool restore

      # Quoted: PowerShell splits a dash-prefixed native argument at its first period.
      - name: JetBrains InspectCode
        run: >
          dotnet jb inspectcode CaptureImage.sln "--output=inspectcode.sarif" "--format=Sarif"
          "--severity=SUGGESTION" "--properties:Configuration=Release" --no-build

      - name: Gate on dead / redundant code
        shell: pwsh
        run: ./.github/scripts/inspectcode-gate.ps1 -Sarif inspectcode.sarif

      - name: Upload InspectCode report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspectcode
          path: inspectcode.sarif
          retention-days: 14

  # audit and license restore on Windows like the build: NuGet prunes the WPF projects'
  # Windows Desktop packages only there, so a Linux restore can't match the lock files.
  audit:
    name: audit
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore CaptureImage.sln --locked-mode

      - name: Vulnerable packages (direct + transitive)
        shell: pwsh
        run: |
          dotnet list CaptureImage.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          ./.github/scripts/vulnerability-gate.ps1 -Report vulnerable.json

      - name: Deprecated / outdated packages (report only)
        if: always()
        shell: pwsh
        run: |
          "## Deprecated packages`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          dotnet list CaptureImage.sln package --deprecated --include-transitive | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  license:
    name: license
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore CaptureImage.sln --locked-mode

      - name: Restore tools
        run: dotnet tool restore

      # Only the shipped app's dependency closure is checked against the allowlist —
      # build/test-only tooling never reaches users.
      - name: Licenses of shipped dependencies
        run: >
          dotnet nuget-license -i src/CaptureImage.App/CaptureImage.App.csproj -t
          -a .github/license/allowed-licenses.json
          -ignore .github/license/ignored-packages.json
          -o Markdown -fo license-report.md

      - name: License report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path license-report.md) {
            "## Licenses of shipped dependencies`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content license-report.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  publish-smoke:
    name: publish-smoke
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish app (same switches as the release workflow)
        run: >
          dotnet publish src/CaptureImage.App/CaptureImage.App.csproj
          -c Release -r win-x64 --self-contained false
          -o publish

      - name: Verify published payload
        shell: pwsh
        run: |
          $required = @(
            'CaptureImage.App.exe', 'CaptureImage.App.dll', 'CaptureImage.App.runtimeconfig.json',
            'Wpf.Ui.dll', 'LICENSE', 'NOTICE',
            'docs/legal/DISCLAIMER.md', 'docs/legal/PRIVACY.md', 'docs/legal/TERMS.md',
            'docs/legal/THIRD_PARTY_NOTICES.md', 'docs/CONTRIBUTORS.md',
            'vi/CaptureImage.ViewModels.resources.dll', 'ar/CaptureImage.ViewModels.resources.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path publish $_)) }
          if ($missing) { $missing | ForEach-Object { "::error title=publish-smoke::missing $_" }; exit 1 }
          $size = (Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "publish-smoke: payload OK ({0:N1} MB)" -f $size

      # Starts the published app with a throwaway data folder, opens every page,
      # saves a screenshot of each and exits 0 (non-zero on any failure).
      - name: Smoke test the published app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'smoke-data'
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $app = Start-Process -FilePath publish/CaptureImage.App.exe -PassThru `
            -ArgumentList @('--screenshots', $shots, '--data-dir', $data, '--instance-id', 'ci')
          if (-not $app.WaitForExit(180000)) { $app.Kill(); "::error title=publish-smoke::the app did not exit within 3 minutes"; exit 1 }
          Get-ChildItem (Join-Path $data 'logs') -Filter *.log | Get-Content
          if ($app.ExitCode -ne 0) { "::error title=publish-smoke::smoke test exited with $($app.ExitCode)"; exit 1 }
          $pages = @(Get-ChildItem $shots -Filter *.png).Count
          if ($pages -lt 7) { "::error title=publish-smoke::expected 7 page screenshots, got $pages"; exit 1 }
          "smoke test OK: $pages pages"

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
          if-no-files-found: ignore

  # End-to-end UI tests (FlaUI) against the real app. Not a required check yet.
  ui-tests:
    name: ui-tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore + build
        run: |
          dotnet restore CaptureImage.sln --locked-mode
          dotnet build tests/CaptureImage.App.UiTests/CaptureImage.App.UiTests.csproj -c Release --no-restore

      - name: UI tests (FlaUI)
        env:
          CAPTUREIMAGE_UI_TESTS: "1"
        run: >
          dotnet test --project tests/CaptureImage.App.UiTests/CaptureImage.App.UiTests.csproj
          -c Release --no-build --results-directory TestResults-ui --report-xunit-trx

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: TestResults-ui/**
          retention-days: 14
          if-no-files-found: ignore
