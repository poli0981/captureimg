name: Dependency review

# Blocks pull requests that introduce a vulnerable dependency (any severity) or a
# dependency under a license that cannot be combined with GPL-3.0-or-later.
# `dependency-review` is a required status check.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment on failure
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: true
          deny-licenses: >-
            SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-1.0, CC-BY-NC-2.0, CC-BY-NC-2.5,
            CC-BY-NC-3.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0, CC-BY-NC-ND-4.0,
            JSON, CPOL-1.02
          comment-summary-in-pr: on-failure
