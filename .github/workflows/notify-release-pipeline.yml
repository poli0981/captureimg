name: Notify Release Pipeline

# Reports the outcome of each Release workflow run to Discord. The public release
# announcement itself comes from announce-release.yml when the draft is published.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] — read-only; no checkout of the triggering ref
    workflows: ["Release"]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
    # Reusable workflows are pinned to a commit of poli0981/.github.
    uses: poli0981/.github/.github/workflows/notify-release-pipeline.yml@e973e2f15725356653ef07539016670ad2733f83
    secrets:
      DISCORD_RELEASE_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_PIPELINE_WEBHOOK }}
