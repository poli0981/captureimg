name: Notify CI Failures

# Posts failed CI runs on `main` to Discord through the shared notifier in
# poli0981/.github. Only pushes made in this repository qualify — a fork's pull
# request also reports `head_branch == 'main'`, and its commit message must never
# reach the Discord channel.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] — read-only; no checkout of the triggering ref
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
    # Reusable workflows are pinned to a commit of poli0981/.github.
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@e973e2f15725356653ef07539016670ad2733f83
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
