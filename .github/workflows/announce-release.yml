name: Announce Release to Discord

# Fires when a release is published. Releases are created as drafts by
# release.yml and published by the maintainer (`gh release edit --draft=false`),
# so this event is raised by a user token and actually triggers.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-announce"
        required: true
        type: string

permissions: {}

jobs:
  announce:
    permissions:
      contents: read
    # Reusable workflows are pinned to a commit of poli0981/.github.
    uses: poli0981/.github/.github/workflows/announce-release.yml@e973e2f15725356653ef07539016670ad2733f83
    with:
      tag_override: ${{ inputs.tag || '' }}
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      DISCORD_REPO_WEBHOOK: ${{ secrets.DISCORD_REPO_WEBHOOK }}
