name: Release

# Builds a release from a `vX.Y.Z[-pre]` tag and uploads it as a DRAFT GitHub
# Release. Velopack clients (`prerelease: false`) never see drafts, so the
# maintainer can verify the assets before publishing with
# `gh release edit <tag> --draft=false` — publishing with a user token also fires
# `release: published`, which runs announce-release.yml.
#
# Re-running for an existing tag (the tag ruleset forbids moving tags) works through
# workflow_dispatch: it checks out the requested tag with the workflow as it is on
# the default branch. `dry_run` builds and packs without touching any release.
#
# Code signing is not available yet (SignPath declined the application); every
# asset gets a SHA-256 checksum and a GitHub build-provenance attestation instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v2.0.0"
        required: true
        type: string
      dry_run:
        description: "Build and pack only (no GitHub Release)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Must stay identical across releases so installed copies keep updating and
  # existing shortcuts stay valid.
  PACK_ID: CaptureImage
  PACK_TITLE: CaptureImage
  MAIN_EXE: CaptureImage.App.exe
  CHANNEL: win
  # Installed by Setup / the updater when missing (the app is framework-dependent).
  RUNTIME: net10-x64-desktop

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve and validate the tag
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          $semver = '^v(?<v>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
          if ($tag -notmatch $semver) { throw "Not a SemVer release tag: '$tag'" }
          $version = $Matches.v
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Tag must match Directory.Build.props
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $declared = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($declared -ne $env:VERSION) { throw "Tag version $env:VERSION does not match Directory.Build.props ($declared)." }

      # No NuGet cache here: a poisoned cache must never reach release binaries.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # One command per step: a pwsh step only fails when its last native command does.
      - name: Restore
        run: dotnet restore CaptureImage.sln --locked-mode

      - name: Build
        run: dotnet build CaptureImage.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution CaptureImage.sln -c Release --no-build

      - name: Restore tools
        run: dotnet tool restore

      # Framework-dependent: Setup installs the .NET Desktop Runtime when it is missing.
      - name: Publish app
        run: >
          dotnet publish src/CaptureImage.App/CaptureImage.App.csproj
          -c Release -r win-x64 --self-contained false
          -o publish

      - name: Smoke test the published app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'smoke-data'
          $app = Start-Process -FilePath publish/CaptureImage.App.exe -PassThru `
            -ArgumentList @('--smoke-test', '--data-dir', $data, '--instance-id', 'release')
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'The app did not exit within 3 minutes.' }
          if ($app.ExitCode -ne 0) {
            Get-ChildItem (Join-Path $data 'logs') -Filter *.log | Get-Content
            throw "Smoke test exited with $($app.ExitCode)."
          }

      - name: Release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match "^## \[$([regex]::Escape($env:VERSION))\]" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION." }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($l) $l -match '^## \[' })
          if ($end -lt 0) { $end = $lines.Length }
          $lines[($start + 1)..($end - 1)] | Out-File release-notes.md -Encoding utf8

      - name: Velopack pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Full packages only: deltas need the previous package and are not worth the
        # extra moving parts for this app's size.
        run: |
          dotnet vpk pack --packId $env:PACK_ID --packVersion $env:VERSION --packTitle $env:PACK_TITLE `
            --packAuthors "poli0981 and contributors" --packDir publish --mainExe $env:MAIN_EXE `
            --channel $env:CHANNEL --shortcuts "Desktop,StartMenuRoot" --delta None `
            --framework $env:RUNTIME --icon src/CaptureImage.UI/Assets/CaptureImage.ico `
            --releaseNotes release-notes.md --outputDir releases

      - name: Collect assets, SBOM and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem releases -File | Copy-Item -Destination dist
          dotnet CycloneDX src/CaptureImage.App/CaptureImage.App.csproj --output dist `
            --filename "CaptureImage-$env:VERSION-sbom.cdx.json" --output-format Json `
            --set-name CaptureImage --set-version $env:VERSION --exclude-test-projects
          Push-Location dist
          # Hash first, then write: Out-File creates SHA256SUMS.txt as soon as the pipeline
          # starts, so it would otherwise list (and fail to read) its own output file.
          $sums = Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $sums | Out-File SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Release body
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $body = @(
            "## CaptureImage v$env:VERSION", '',
            (Get-Content release-notes.md -Raw), '',
            '### Downloads',
            '- **`CaptureImage-win-Setup.exe`** — installer (per-user). Windows 11 22H2 or later; installs the .NET 10 Desktop Runtime if it is missing.',
            '- **`CaptureImage-win-Portable.zip`** — extract-and-run build without installer (needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)).',
            '- **`*-full.nupkg`**, **`releases.win.json`** — update feed used by the in-app updater.',
            '- **`SHA256SUMS.txt`**, **`*-sbom.cdx.json`** — checksums and CycloneDX SBOM.', '',
            '### Verify the download',
            'The installer is not code-signed yet, so Windows SmartScreen shows "Unknown publisher".',
            'Check the checksum or the build-provenance attestation before running it:', '',
            '```powershell',
            'Get-FileHash -Algorithm SHA256 .\CaptureImage-win-Setup.exe   # compare with SHA256SUMS.txt',
            "gh attestation verify .\CaptureImage-win-Setup.exe --repo $env:REPOSITORY",
            '```'
          )
          $body | Out-File release-body.md -Encoding utf8

      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/**
            release-body.md
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create / update the draft release
      id-token: write # build provenance
      attestations: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-body.md
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--draft --verify-tag --title "CaptureImage v$VERSION" --notes-file release-body.md)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
