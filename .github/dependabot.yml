version: 2

# NuGet updates only work because Directory.Build.props sets
# EnableWindowsTargeting=true — Dependabot's updater runs on Linux and otherwise
# reports every newer version as "not compatible" with the Windows TFMs.
#
# The updater restores on Linux, where NuGet prunes the WPF projects' Windows
# Desktop packages differently: if a PR fails `restore --locked-mode`, run
# `dotnet restore CaptureImage.sln --force-evaluate` on Windows and push the
# lock files.
#
# Dependabot pull requests get no repository secrets, so the `sonarcloud` check
# passes without analysing them; main is analysed after the merge.

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      serilog:
        patterns:
          - "Serilog*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      vortice:
        patterns:
          - "Vortice.*"
      velopack:
        # The library and the `vpk` tool in .config/dotnet-tools.json must move together.
        patterns:
          - "Velopack"
          - "vpk"
      wpf-ui:
        patterns:
          - "WPF-UI*"
          - "H.NotifyIcon*"
          - "CommunityToolkit.Mvvm"
      win32-interop:
        patterns:
          - "Microsoft.Windows.CsWin32"
      test-tooling:
        patterns:
          - "xunit*"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "Microsoft.Testing.*"
          - "FlaUI*"
      dev-tools:
        patterns:
          - "jetbrains.resharper.globaltools"
          - "nuget-license"
          - "dotnet-reportgenerator-globaltool"
          - "cyclonedx"
          - "dotnet-sonarscanner"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
