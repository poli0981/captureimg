version: 2

# NuGet updates only work because Directory.Build.props sets
# EnableWindowsTargeting=true — Dependabot's updater runs on Linux and otherwise
# reports every newer version as "not compatible" with the Windows TFMs.
#
# open-pull-requests-limit is 0 while the v2.0 rewrite is in flight (every merge
# would force the large rewrite PR to rebase and re-run all required checks).
# Security updates are not affected by the limit. Restore the limits after the
# 2.0.0 release.

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.Drawing.Common"
      serilog:
        patterns:
          - "Serilog*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      vortice:
        patterns:
          - "Vortice.*"
      velopack:
        # The library and the `vpk` tool in .config/dotnet-tools.json must move together.
        patterns:
          - "Velopack"
          - "vpk"
      wpf-ui:
        patterns:
          - "WPF-UI*"
          - "H.NotifyIcon*"
          - "CommunityToolkit.Mvvm"
      win32-interop:
        patterns:
          - "Microsoft.Windows.CsWin32"
      test-tooling:
        patterns:
          - "xunit*"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "Microsoft.Testing.*"
          - "FlaUI*"
      dev-tools:
        patterns:
          - "jetbrains.resharper.globaltools"
          - "nuget-license"
          - "dotnet-reportgenerator-globaltool"
          - "cyclonedx"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
