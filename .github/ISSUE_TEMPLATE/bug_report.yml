name: Bug report
description: Something is broken, crashes, or produces wrong output.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Reports with the version, Windows build and
        steps to reproduce are the ones that get fixed.

        **Tip:** in the app, set **Settings → Advanced → Minimum log level** to **Debug**,
        reproduce the problem, then use **Export diagnostics** and attach the zip below (user
        paths are removed automatically).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing what's wrong.
      placeholder: "Region captures of my second monitor are shifted to the left."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from opening CaptureImage.
      placeholder: |
        1. Start the game in borderless windowed mode on my second monitor (150% scaling).
        2. Click Arm on the Dashboard.
        3. Press Ctrl+Shift+F11 and drag an area.
        4. Open the saved PNG.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Capture mode
      options:
        - "Window (Ctrl+Shift+F12 by default)"
        - "Region (Ctrl+Shift+F11 by default)"
        - "Screen (Ctrl+Shift+F10 by default)"
        - "Not about capturing (UI, settings, library, update…)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CaptureImage version
      description: "Shown in the title bar and on the About page, e.g. `2.0.0 (abc1234)`."
      placeholder: "2.0.0 (abc1234)"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Run `winver`, e.g. `Windows 11 Pro 24H2 (26100.2454)`."
    validations:
      required: true

  - type: input
    id: displays
    attributes:
      label: Displays and graphics
      description: "Number of monitors, their scaling, whether HDR is on, GPU and driver."
      placeholder: "2 monitors (100% + 150%), HDR on the first, RTX 4070 / 566.14"

  - type: input
    id: game
    attributes:
      label: Game or application
      description: "Name, and whether it runs windowed, borderless or exclusive full screen."

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics or log excerpt
      description: |
        Attach the zip from **Export diagnostics**, or paste the relevant lines from
        `%LocalAppData%\poli0981\CaptureImage\logs\captureimage-<date>.log`.
      render: text

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I read the capture limitations in `docs/legal/DISCLAIMER.md` (section 2) and this isn't one of them.
          required: true
        - label: This is not a security vulnerability (those go to `security@poli0981.dev` or a private advisory).
          required: true
